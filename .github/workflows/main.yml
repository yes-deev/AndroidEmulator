name: Android 14 Web Scrcpy Runner

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-emulator:
    # Namespace 8 vCPU / 16GB RAM runner tag
    runs-on: nscloud-ubuntu-22.04-amd64-8x16
    # Hard limit of 24 hours (1440 minutes) for this job
    timeout-minutes: 1440

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js (for ws-scrcpy)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Hardware Acceleration (KVM)
        run: |
          sudo chmod 666 /dev/kvm
          sudo usermod -aG kvm $USER

      - name: Install Android SDK & Android 14 (API 34)
        run: |
          # Install SDK Command Line Tools
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest

          # Set Environment Variables
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$HOME/android-sdk/emulator:$PATH" >> $GITHUB_ENV

      - name: Accept Licenses & Install Android 14 System Image
        run: |
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$HOME/android-sdk/emulator:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64" "emulator"

      - name: Create AVD and Start Android 14 Emulator
        run: |
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$HOME/android-sdk/emulator:$PATH"
          echo "no" | avdmanager create avd -n android14_avd -k "system-images;android-34;google_apis;x86_64" --device "pixel_6"

          echo "Starting Emulator with 6 cores and 8GB RAM..."
          nohup emulator -avd android14_avd \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu host \
            -accel on \
            -cores 6 \
            -memory 8192 \
            > emulator.log 2>&1 &

          echo "Waiting for Android Emulator to boot..."
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done'
          echo "Android 14 successfully booted!"

      - name: Install & Launch Web Scrcpy (ws-scrcpy)
        run: |
          # Clone ws-scrcpy
          git clone https://github.com/NetrisTV/ws-scrcpy.git
          cd ws-scrcpy

          # Install dependencies and build
          npm install
          npm run build

          # Start ws-scrcpy in the background on port 8000
          nohup npm start > ../scrcpy.log 2>&1 &
          sleep 5
          echo "ws-scrcpy is running on port 8000"

      - name: Install Cloudflared & Create Tunnel
        run: |
          # Download and install cloudflared
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          echo "=========================================================="
          echo "  CLOUDFLARE QUICK TUNNEL LINK (ACCESS YOUR EMULATOR HERE)"
          echo "=========================================================="

          # Start Cloudflare tunnel and log public URL
          cloudflared tunnel --url http://localhost:8000 > tunnel.log 2>&1 &
          
          # Wait and print the Cloudflare HTTPS URL from logs
          sleep 6
          grep -o 'https://[-a-zA-Z0-0.]*trycloudflare.com' tunnel.log || cat tunnel.log

      - name: Keep Alive for 24 Hours
        run: |
          echo "Emulator (6 vCPU / 8GB RAM), ws-scrcpy, and Cloudflare Tunnel are active."
          echo "Keeping runner alive for 24 hours (86,400 seconds)..."
          
          # Sleep in 1-hour increments for 24 hours to prevent buffer overflow issues
          for i in {1..24}; do
            echo "Runner running... hour $i of 24 completed."
            sleep 3600
          done
