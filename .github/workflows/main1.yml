name: Android API 34 (KVM) + Cloudflare Web VNC

on:
  workflow_dispatch:

jobs:
  interactive-emulator:
    # Namespace high-performance runner (8 vCPU / 16GB RAM)
    runs-on: nscloud-ubuntu-22.04-amd64-8x16
    timeout-minutes: 1440 # 24 hours max job limit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure KVM Permission Group
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          sudo usermod -aG kvm $USER

      - name: Install Display, Audio, and Tunneling Packages
        run: |
          sudo apt-get update
          # Install headless display, VNC, noVNC proxy, and pulse audio dependencies
          sudo apt-get install -y xvfb x11vnc novnc websockify jq libpulse0
          
          # Download and deploy the official cloudflared binary
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Initialize Web VNC Proxy Backend
        run: |
          # Start Xvfb virtual framebuffer on display :1
          Xvfb :1 -screen 0 720x1280x24 &
          sleep 2
          
          # Start x11vnc to stream display :1 over VNC (port 5900)
          x11vnc -display :1 -nopw -listen 127.0.0.1 -forever -shared &
          sleep 2
          
          # Start websockify to convert VNC to WebSockets for noVNC (port 6080)
          websockify --web=/usr/share/novnc 6080 127.0.0.1:5900 &
          sleep 2

      - name: Boot Android API 34 Emulator & Tunnel Stream
        env:
          DISPLAY: ":1" 
        run: |
          # 1. Start the Cloudflare Tunnel pointing to noVNC web port (6080)
          cloudflared tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &
          sleep 5
          
          echo "=========================================================="
          echo "🌐 CLOUDFLARE WEB VNC TUNNEL LINK:"
          echo "=========================================================="
          grep -o 'https://[^ ]*trycloudflare.com' cloudflare.log | head -n 1
          echo "=========================================================="

          # 2. Add tools to PATH and FORCE all Android directories
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          # 3. Accept Licenses & Install Image
          echo "Accepting SDK Licenses..."
          yes | sdkmanager --licenses > /dev/null
          
          echo "Installing system image..."
          sdkmanager "system-images;android-34;google_apis;x86_64"
          
          # 4. Create AVD non-interactively
          echo "Creating Virtual Device..."
          echo "no" | avdmanager create avd -n test_device -k "system-images;android-34;google_apis;x86_64" -d pixel --force
          
          # 5. OVERRIDE HARDWARE SPECS (6 Cores, 8GB RAM)
          echo "hw.ramSize=8192MB" >> "$ANDROID_AVD_HOME/test_device.avd/config.ini"
          echo "hw.cpu.ncore=6" >> "$ANDROID_AVD_HOME/test_device.avd/config.ini"

          # 6. Launch Emulator non-blocking (Swiftshader rendering for cloud stability)
          echo "Launching Emulator..."
          nohup emulator -avd test_device \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-boot-anim \
            -camera-back none \
            -memory 8192 \
            -cores 6 \
            </dev/null > emulator.log 2>&1 &
          
          # 7. Wait for ADB execution layers and boot completion
          echo "Waiting for ADB interface..."
          adb wait-for-device

          echo "Waiting for Android system boot..."
          MAX_RETRIES=150
          COUNT=0
          while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; do
            sleep 2
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "ERROR: Emulator failed to boot within 5 minutes."
              echo "--- EMULATOR LOG OUTPUT ---"
              cat emulator.log
              exit 1
            fi
          done

          echo "Android environment fully booted and running!"

      - name: Keep Alive for 24 Hours
        run: |
          echo "Android Emulator, Web VNC, and Cloudflare Tunnel are active."
          echo "Keeping runner alive for 24 hours..."
          
          # Loop in 1-hour increments up to 24 hours
          for i in {1..24}; do
            echo "Runner alive... Hour $i of 24 completed."
            sleep 3600
          done
